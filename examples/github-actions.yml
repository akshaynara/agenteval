# Red-team your agent on every pull request.
# Copy to .github/workflows/agenteval.yml in YOUR agent's repository,
# and add ANTHROPIC_API_KEY (or GEMINI_API_KEY) as a repository secret.

name: AgentEval

on:
  pull_request:

jobs:
  agenteval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Start your agent however you normally do, e.g.:
      # - run: docker compose up -d my-agent

      - uses: akshaynara/agenteval@v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          config: agenteval.yaml
          # fail-on: high                 # default: run.fail_on from the config
          # baseline: agenteval-baseline.json   # regression mode: replay and compare
          # args: --personas 4 --probes 4

      # The job fails when the gate trips. The Markdown summary is on the job page,
      # and the JSON + HTML reports are uploaded as the "agenteval-report" artifact.
