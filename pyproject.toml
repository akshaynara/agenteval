[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agenteval"
version = "0.3.0"
description = "Red-team and stress-test conversational AI agents with synthetic customers and safety probes — from your terminal, your CI, or the browser."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Akshay Nara" }]
requires-python = ">=3.10"
keywords = ["llm", "evaluation", "red-teaming", "ai-safety", "agents", "testing", "conversational-ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "anthropic>=0.39,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.0",
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
agenteval = "agenteval.cli:main"

[project.urls]
Homepage = "https://github.com/akshaynara/agenteval"
Documentation = "https://agenteval.gitbook.io/agenteval-docs/"
"Try it" = "https://try-agenteval.netlify.app"

[tool.hatch.build.targets.wheel]
packages = ["src/agenteval"]

# The web UI lives in frontend/ (Netlify deploys it from there); ship a copy inside the wheel.
[tool.hatch.build.targets.wheel.force-include]
"frontend" = "agenteval/web"

[tool.hatch.build.targets.sdist]
include = ["src/agenteval", "frontend", "examples", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
